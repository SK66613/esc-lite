<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8ff" />
  <title>Escalita Lite — Mini App Constructor</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desktop-bg" aria-hidden="true"></div>

  <main id="app" class="app-shell">
    <div class="safe-top"></div>

    <div class="system-bar" aria-label="Статус">
      <strong id="clock">9:41</strong>
      <div class="telegram-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.7 18.2 20c-.2 1.1-.8 1.4-1.7.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.7 13.5.8 12c-1.1-.3-1.1-1.1.2-1.6L20.1 3c.9-.3 1.7.2 1.4.7Z"/></svg>
        <span>TELEGRAM</span>
      </div>
      <div class="sys-icons" aria-hidden="true">
        <span class="bars">▂▄▆█</span><span class="wifi">⌁</span><span class="battery"></span>
      </div>
    </div>

    <header id="pageHeader" class="page-header"></header>
    <section id="page" class="page" aria-live="polite"></section>
    <nav id="bottomNav" class="bottom-nav" aria-label="Главная навигация"></nav>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
